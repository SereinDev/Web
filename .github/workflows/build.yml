on:
  push:
    paths:
      - "**.vue"
      - "**.html"
      - "**.ts"
      - "**.js"
      - "**.json"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          pnpm install
          pnpm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          path: "./dist"
          name: frontend
